name: Auction Watcher

on:
  push:
    paths:
      - 'watchlist.json'     # run immediately whenever picks are pushed
  schedule:
    - cron: '*/30 * * * *'  # also poll every 30 minutes
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests

      - name: Check for closing auctions
        run: python equip_bid_check.py
